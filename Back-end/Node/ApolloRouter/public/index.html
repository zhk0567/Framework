<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Apollo Router · Federation v2 — 呈现页</title>
    <style>
      :root {
        color-scheme: dark light;
        --bg: #0f1419;
        --card: #1a2332;
        --accent: #d946ef;
        --text: #e6edf3;
        --muted: #8b9cb3;
        --border: #2d3a4d;
        font-family: "Segoe UI", system-ui, sans-serif;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #f4f6f8;
          --card: #fff;
          --text: #0f172a;
          --muted: #64748b;
          --border: #e2e8f0;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        line-height: 1.55;
      }
      main {
        max-width: 52rem;
        margin: 0 auto;
        padding: 2rem 1.25rem 3rem;
      }
      h1 {
        font-size: 1.55rem;
        font-weight: 700;
        margin: 0 0 0.35rem;
      }
      .sub {
        color: var(--muted);
        font-size: 0.95rem;
        margin-bottom: 1.5rem;
      }
      section {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 1rem 1.2rem;
        margin-bottom: 1rem;
      }
      section h2 {
        font-size: 0.95rem;
        margin: 0 0 0.5rem;
        color: var(--accent);
      }
      pre {
        margin: 0;
        padding: 0.75rem 1rem;
        background: rgba(0, 0, 0, 0.22);
        border-radius: 8px;
        overflow-x: auto;
        font-size: 0.78rem;
      }
      @media (prefers-color-scheme: light) {
        pre {
          background: #f1f5f9;
        }
      }
      button {
        cursor: pointer;
        border: 1px solid var(--border);
        background: var(--accent);
        color: #fff;
        padding: 0.4rem 0.8rem;
        border-radius: 8px;
        font-size: 0.85rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Apollo Router · Fed v2（占位）</h1>
      <p class="sub">默认端口 <strong>3123</strong>。与 <code>GraphQLFederation</code> 的 stitch 教学向对照见文档。</p>
      <section>
        <h2><code>GET /api/health</code></h2>
        <button type="button" id="btn-health">请求</button>
        <pre id="out-health">（点击）</pre>
      </section>
      <section>
        <h2><code>GET /api/info</code></h2>
        <button type="button" id="btn-info">请求</button>
        <pre id="out-info">（点击）</pre>
      </section>
    </main>
    <script>
      const $ = (id) => document.getElementById(id);
      async function fetchJson(path) {
        const res = await fetch(path);
        const text = await res.text();
        try {
          return JSON.parse(text);
        } catch {
          return text;
        }
      }
      $("btn-health").onclick = async () => {
        $("out-health").textContent = JSON.stringify(await fetchJson("/api/health"), null, 2);
      };
      $("btn-info").onclick = async () => {
        $("out-info").textContent = JSON.stringify(await fetchJson("/api/info"), null, 2);
      };
    </script>
  </body>
</html>
